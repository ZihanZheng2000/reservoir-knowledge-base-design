interface:
  display_name: "Reservoir KU Extraction"
  short_description: "Extract operational KUs from sources."
  default_prompt: >-
    Extract source-grounded operational KUs from the selected reservoir documents and validate the JSONL output.
    Use the approved dimensions: Operation Purpose; Operation Rules; Infrastructure; Real-Time / Emergency Operations;
    Coordination / Governance; Operational Data; Research / Modeling / Analysis; Evidence Gap / Uncertainty.
    Treat official operating manuals, operation guides, reservoir operation plans, water control manuals, annual operating
    plans, and agency technical appendices as high-density priority sources. For those documents, do not produce only a
    high-level summary. Mine distinct operating rules, thresholds, release criteria, triggers, infrastructure limits, data
    inputs, responsible agencies, and documentation requirements. Use no artificial KU cap; the number of KUs should follow
    the number of distinct, source-grounded, operationally useful findings. For every KU, write `finding` in the analyst's
    own words rather than copying the evidence quote. Write `why_it_matters` specifically for that finding and its reservoir
    operation implication; do not use a generic template sentence. Write `condition_or_trigger` as the actual condition,
    threshold, scenario, rule status, data context, or decision trigger when one is present; do not fill it with the
    engineering dimension name.
